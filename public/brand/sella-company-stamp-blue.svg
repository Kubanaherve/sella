
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <!-- Crisp Vector Rubber Stamp (Optimized for small PDF size < 1MB) -->
    <filter id="vector-ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
