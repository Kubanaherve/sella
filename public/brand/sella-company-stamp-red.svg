    <g transform="translate(72, 260) scale(0.95)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#b91c1c" stroke="none" />
    </g>
    <g transform="translate(448, 260) scale(0.95)">
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#b91c1c" stroke="none" />
    </g>

    <!-- ── Center Content with Real Sella Logo & Herve Friend KUBANA ── -->
    
    <!-- Real Sella Vector Icon (Top of inner circle) -->
    <g transform="translate(235, 142) scale(0.50)" fill="#b91c1c" stroke="none">
      
  <path d="M28 32 C29 16 38 5 51 5 C65 5 74 16 75 33 L67 33 C66 20 60 12 51 12 C42 12 36 20 35 32 Z" fill-rule="evenodd"/>
  <path d="M30 28 H72 C81 28 86 32 88 41 L90 51 C84 44 73 42 61 41 L49 40 C43 40 39 42 40 45 C41 47 44 48 47 49 C32 47 23 40 23 35 C23 31 26 29 30 28 Z" fill-rule="evenodd"/>
  <path d="M11 65 C14 72 22 76 32 76 C44 76 52 72 57 71 C69 74 76 80 76 85 C76 92 71 95 63 95 H24 C12 95 5 89 7 78 Z" fill-rule="evenodd"/>
  <path d="M31 28 C23 31 22 36 26 41 C30 46 39 49 50 51 L70 55 C85 58 93 64 94 74 C96 86 86 95 69 95 H61 C69 94 75 91 75 85 C75 77 65 72 51 69 L30 65 C15 62 10 56 12 47 L14 40 C16 33 22 28 31 28 Z" fill-rule="evenodd"/>

    </g>

    <!-- Brand Wordmark -->
    <text class="emblem-title-b91c1c" x="260" y="208">SELLA</text>

    <!-- Upper Divider -->
    <line x1="168" y1="216" x2="352" y2="216" stroke-width="2" />
    <line x1="188" y1="219" x2="332" y2="219" stroke-width="0.8" />

    <!-- Owner Name & Title: Herve Friend KUBANA, CEO -->
    <text class="name-meta-b91c1c" x="260" y="238">HERVE FRIEND KUBANA</text>
    <text class="title-meta-b91c1c" x="260" y="256">CHIEF EXECUTIVE OFFICER (CEO)</text>
    
    <!-- Middle Divider -->
    <line x1="175" y1="264" x2="345" y2="264" stroke-width="1.5" />

    <!-- Corporate Identifiers & Sign Lines -->
    <text class="sub-meta-b91c1c" x="260" y="282">TIN: 109876543 • KIGALI</text>
    <text class="dotted-line-b91c1c" x="260" y="306">DATE: ....................</text>
    <text class="dotted-line-b91c1c" x="260" y="330">SIGN: ....................</text>
  </g>
