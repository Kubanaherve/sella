<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sella splash preview</title>
  <style>
    :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #b9d4ff; font-family: system-ui, sans-serif; }
    .root {
      position: relative; min-height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; overflow: hidden; background: #b9d4ff;
    }
    .atmosphere {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 95% 65% at 10% 6%, rgba(90,200,250,.72), transparent 56%),
        radial-gradient(ellipse 85% 60% at 94% 94%, rgba(26,111,255,.55), transparent 54%),
        radial-gradient(ellipse 75% 55% at 48% 40%, rgba(11,63,204,.22), transparent 66%),
        radial-gradient(ellipse 60% 45% at 80% 18%, rgba(90,200,250,.4), transparent 60%),
        linear-gradient(165deg, #cfe4ff 0%, #a8cbff 45%, #8fb8ff 72%, #7aa8ff 100%);
    }
    .stage { position: relative; z-index: 1; width: min(86vw, 320px); display: flex; flex-direction: column; align-items: center; }
    .slot { position: relative; height: 180px; width: 100%; display: flex; align-items: center; justify-content: center; }
    .word {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      animation: word-life 2.8s var(--ease) forwards;
    }
    .word img {
      width: min(86vw, 300px); height: auto; display: block;
      clip-path: inset(0 100% 0 0);
      animation: write 1.15s var(--ease) 0.18s forwards;
      filter: drop-shadow(0 10px 28px rgba(26,111,255,.28));
    }
    .logo {
      position: absolute; opacity: 0; transform: scale(.88) translateY(10px);
      animation: logo-in 0.5s var(--ease) 1.68s forwards;
      filter: drop-shadow(0 14px 28px rgba(26,111,255,.28));
    }
    .logo svg { width: 128px; height: 128px; display: block; }
    .aura {
      position: absolute; inset: -28%; border-radius: 50%;
      background: radial-gradient(circle, rgba(90,200,250,.32), transparent 68%);
      filter: blur(18px);
    }
    .progress {
      margin-top: .5rem; width: min(56vw, 180px); height: 3px; border-radius: 999px;
      background: rgba(26,111,255,.12); overflow: hidden;
      animation: bar-life 2.8s var(--ease) forwards;
    }
    .progress > i {
      display: block; height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #0b3fcc, #1a6fff 55%, #5ac8fa);
      box-shadow: 0 0 12px rgba(90,200,250,.45);
      animation: prog 1.45s var(--ease) 0.3s forwards;
    }
    .tag {
      margin-top: 1.25rem; font-size: 11px; font-weight: 700; letter-spacing: .32em;
      text-transform: uppercase; color: rgba(11,63,204,.85);
      opacity: 0; animation: tag 0.4s var(--ease) 2.2s forwards;
    }
    @keyframes write { to { clip-path: inset(0 0 0 0); } }
    @keyframes word-life {
      0%, 52% { opacity: 1; transform: none; filter: blur(0); }
      60% { opacity: 0; transform: scale(.95) translateY(4px); filter: blur(2px); }
      100% { opacity: 0; }
    }
    @keyframes logo-in { to { opacity: 1; transform: none; } }
    @keyframes prog { 0% { width: 0; } 70% { width: 78%; } 100% { width: 100%; } }
    @keyframes bar-life {
      0% { opacity: 0; }
      8% { opacity: 1; }
      72% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes tag {
      from { opacity: 0; transform: translateY(6px); letter-spacing: .4em; }
      to { opacity: .9; transform: none; letter-spacing: .32em; }
    }
    .hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; z-index: 2; }
    .hint button {
      border: 1px solid rgba(11,63,204,.25); background: rgba(255,255,255,.9);
      border-radius: 999px; padding: 8px 14px; font-weight: 600; color: #0B3FCC; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="root">
    <div class="atmosphere"></div>
    <div class="stage">
      <div class="slot">
        <div class="word">
          <img src="/brand/sella-liquid-glass-script.png" alt="Sella" />
        </div>
        <div class="logo">
          <div class="aura"></div>
          <img src="/brand/sella-bag-independent.png" alt="Sella" style="width:140px;height:140px;object-fit:contain;position:relative;z-index:1" />
        </div>
      </div>
      <div class="progress"><i></i></div>
      <p class="tag">Smarter. Faster. Together.</p>
    </div>
    <div class="hint"><button type="button" onclick="location.reload()">Replay</button></div>
  </div>
</body>
</html>
